# Route-classifier dataset: source of truth (utterances.csv is generated from it).
#
# Author: model-drafted (claude-opus-5-5), 2026-09-28, as documented in classifier_data/README.md.
# The dataset has no Portuguese and its transcripts are two fixed templates, so it can't supply
# training text; its complaint categories and contact reasons informed the human-route topics.
#
# One entry = one template family: paraphrases of the same request, in ES and PT. The family is
# the unit of the train/validation/test split, so paraphrases and translations never leak
# across splits.
#
# route:  answer | clarify | human | out_of_scope
# intent: balance | tx_status | decline_reason | recent_tx | fx | product_info | transfer |
#         bill_payment | follow_up | spending | other

# =====================================================================
# answer: clear, in-scope requests the tools can resolve
# =====================================================================

