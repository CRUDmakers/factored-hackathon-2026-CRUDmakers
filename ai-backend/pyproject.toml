[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-backend"
version = "0.1.0"
description = "Banco LATAM transactional customer-service assistant (AI backend)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "PyYAML==6.0.3",
    # Agent (APIs checked against these versions on 2026-09-28)
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "aiosqlite==0.22.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.6",
    "langchain-core==1.6.5",
    "langchain-openai==1.6.6",
    "langchain-anthropic==1.7.4",
    "lingua-language-detector==2.1.1",
    # Route classifier (fastembed runs the embedding model on ONNX Runtime, no PyTorch)
    "fastembed==0.8.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.4.6",
    # Excel files the assistant generates for download (generate_files, /v1/files)
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
# Only needed to rebuild eval/fixtures/data from the raw S3 dataset.
fixtures = [
    "boto3==1.43.103",
    "python-dotenv==1.2.3",
    "pandas==3.0.6",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "node: needs a live Node mock bank (BANK_BASE_URL, EVAL_SERVICE_KEY)",
    "llm: calls the configured agent model (needs its credentials in .env)",
    "postgres: needs a Postgres server (TEST_POSTGRES_URL)",
]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A markdown template: its long lines are prose inside an f-string.
"src/ai_backend/classifier/report.py" = ["E501"]
# Scenario message templates and word lists: data tables of ES/PT sentences.
"eval/build_scenarios.py" = ["E501"]
# Report templates (markdown prose) and the judge's rubric.
"eval/report.py" = ["E501"]
"eval/judge.py" = ["E501"]
