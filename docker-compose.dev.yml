services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplica as migrações e sobe a API (Swagger em http://localhost:3000/docs).
  # A imagem roda com NODE_ENV=production: sem AUTH_JWT_SECRET e AUTH_SERVICE_KEY ela não sobe.
  # Os valores abaixo são só para a demo local; sobrescreva via ambiente ou arquivo .env na raiz.
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://banking:banking@db:5432/banking
      PORT: 3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-demo-jwt-secret-troque-fora-da-demo-local}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:-demo-service-key}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-900}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Carga dos CSVs de ./data (rodar uma vez): docker compose run --rm etl
  etl:
    build: ./backend
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/etl/cli.js"]
    environment:
      DATABASE_URL: postgresql://banking:banking@db:5432/banking
      DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["etl"]

  # Testes com cobertura contra o banco banking_test: docker compose run --rm test
  test:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "test:coverage"]
    environment:
      TEST_DATABASE_URL: postgresql://banking:banking@db:5432/banking_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  # Internet banking de demonstração (Vite + React servido por nginx): http://localhost:5173
  # No dev o Vite lê as VITE_* do ambiente do container (não de build args) e as usa no NAVEGADOR (por isso localhost).
  frontend:
    image: frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: ${FRONTEND_API_URL:-http://localhost:3000}
      VITE_SERVICE_KEY: ${FRONTEND_SERVICE_KEY:-${AUTH_SERVICE_KEY:-demo-service-key}}
      VITE_AI_URL: ${FRONTEND_AI_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api
      - ai-backend
    volumes:
      - ./frontend:/app

  # Assistente de IA (Backend 2): http://localhost:8000/v1/health · contrato do chat em ai-backend/CHAT_API.md
  # - Cria o próprio banco `ai_backend` neste Postgres ao subir (conversas, checkpoints, traces, handoffs).
  # - Não guarda o segredo JWT nem a chave de serviço: valida cada sessão na API (GET /auth/sessions/current).
  # - O modelo vem de ai-backend/.env (opcional; veja ai-backend/.env.example).
  ai-backend:
    build: ./ai-backend
    env_file:
      - path: ./ai-backend/.env
        required: false
    environment:
      BANK_MODE: http
      BANK_BASE_URL: http://api:3000
      DB_URL: postgresql://banking:banking@db:5432/ai_backend
      CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:5173}
      # Desenvolvimento: o 9router roda no host; de dentro do container ele é host.docker.internal.
      OPENAI_COMPAT_BASE_URL: ${AI_OPENAI_COMPAT_BASE_URL:-http://host.docker.internal:20128/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
