# Tudo é configurado pelo .env da raiz (copie de .env.example). Depois: docker compose up -d --build
# Nome fixo: os volumes (banking-cs-ai_pgdata) não mudam com o nome da pasta do clone.
name: banking-cs-ai
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banking}
      POSTGRES_DB: banking
    ports:
      - "${DB_PORT:-11100}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banking} -d banking"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API do banco (Swagger em http://localhost:${API_PORT}/docs).
  # Roda com NODE_ENV=production: sem AUTH_JWT_SECRET e AUTH_SERVICE_KEY ela não sobe.
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-banking}:${POSTGRES_PASSWORD:-banking}@db:5432/banking
      PORT: 3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?defina AUTH_JWT_SECRET no .env}
      AUTH_SERVICE_KEY: ${AUTH_SERVICE_KEY:?defina AUTH_SERVICE_KEY no .env}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-900}
      LOG_LEVEL: ${API_LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-11101}:3000"

  # Testes com cobertura contra o banco banking_test: docker compose run --rm test
  test:
    build:
      context: ./backend
      target: build
    command: ["npm", "run", "test:coverage"]
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-banking}:${POSTGRES_PASSWORD:-banking}@db:5432/banking_test
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  # Internet banking de demonstração (Vite + React servido por nginx): http://localhost:${FRONTEND_PORT}
  # O nginx do frontend faz proxy de /api -> api e /ai -> ai-backend, então o bundle usa caminhos
  # relativos e funciona acessando de qualquer máquina (http://<ip-do-servidor>:${FRONTEND_PORT}).
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_SERVICE_KEY: ${AUTH_SERVICE_KEY:?defina AUTH_SERVICE_KEY no .env}
        VITE_AI_URL: /ai
    ports:
      - "${FRONTEND_PORT:-11102}:80"
    depends_on:
      - api
      - ai-backend

  # Assistente de IA (Backend 2): http://localhost:${AI_PORT}/v1/health · contrato do chat em ai-backend/CHAT_API.md
  # - Cria o próprio banco `ai_backend` neste Postgres ao subir (conversas, checkpoints, traces, handoffs).
  # - Não guarda o segredo JWT nem a chave de serviço: valida cada sessão na API (GET /auth/sessions/current).
  ai-backend:
    build: ./ai-backend
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-gemini-3.8-flash}
      JUDGE_MODEL: ${JUDGE_MODEL:-gemini-3.1-pro-low}
      BANK_MODE: http
      BANK_BASE_URL: http://api:3000
      DB_URL: postgresql://${POSTGRES_USER:-banking}:${POSTGRES_PASSWORD:-banking}@db:5432/ai_backend
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-11102}
      TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-30}
      LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AI_PORT:-11103}:8000"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
